<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muerde el chorizo - La venganza peruana</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Arial Black', Gadget, sans-serif; background-color: #000; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        canvas { display: block; }
        #info { position: absolute; top: 10px; left: 10px; background-color: rgba(0,0,0,0.7); padding: 10px; border-radius: 5px; z-index: 10; font-family: Arial, sans-serif; }
        #score { font-size: 20px; }
        #message { 
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0,0,0,0.8);
            padding: 20px;
            border-radius: 10px;
            font-size: 24px;
            text-align: center;
            display: none; 
            z-index: 100; 
            font-family: Arial, sans-serif;
        }
        #ghostFlashScreen { 
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000; 
            display: none; 
            justify-content: center;
            align-items: center;
            z-index: 998; 
            overflow: hidden; 
        }
        #ghostFlashImage {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain; 
        }
        .shake-active {
            animation: strongJitterShake 0.1s linear infinite;
        }
        @keyframes strongJitterShake { 
            0% { transform: translate(2px, 2px) rotate(0.5deg); }
            10% { transform: translate(-4px, -5px) rotate(-1deg); }
            20% { transform: translate(-6px, 1px) rotate(1deg); }
            30% { transform: translate(6px, 5px) rotate(0deg); }
            40% { transform: translate(4px, -4px) rotate(1deg); }
            50% { transform: translate(-4px, 5px) rotate(-1deg); }
            60% { transform: translate(-6px, 4px) rotate(0deg); }
            70% { transform: translate(6px, 4px) rotate(-1deg); }
            80% { transform: translate(-4px, -4px) rotate(1deg); }
            90% { transform: translate(4px, 5px) rotate(0deg); }
            100% { transform: translate(2px, -3px) rotate(-1deg); }
        }

        #gameOverScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://i.ibb.co/nq8XpXMJ/Bruno-Game-Over.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: none; 
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 999; 
            padding: 20px;
            box-sizing: border-box;
        }
        #gameOverMainText {
            font-size: clamp(3rem, 10vw, 7rem); 
            color: #ff0000; 
            text-shadow: 
                -2px -2px 0 #000,  
                 2px -2px 0 #000,
                -2px  2px 0 #000,
                 2px  2px 0 #000,
                 4px 4px 5px rgba(0,0,0,0.7); 
            margin-bottom: 20px;
        }
        #gameOverScreen p { 
            margin-top: 10px;
            font-size: clamp(1rem, 3vw, 1.5rem); 
            color: #fff;
            background-color: rgba(0,0,0,0.75); 
            padding: 10px 15px;
            border-radius: 8px;
            max-width: 90%;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        #customGameOverMessage { 
            font-size: clamp(1.2rem, 4vw, 1.8rem); 
            color: #ffcc00; 
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 15px;
        }

        #joystick-area {
            position: absolute;
            bottom: 70px; 
            left: 20px;
            width: 150px;
            height: 150px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: none; 
            align-items: center;
            justify-content: center;
            z-index: 20;
        }
        #joystick-knob {
            width: 70px;
            height: 70px;
            background-color: rgba(255, 255, 0, 0.7); 
            border-radius: 50%;
            position: absolute;
        }
        #action-buttons { 
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: none; 
            flex-direction: column;
            z-index: 20;
        }

        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #ff0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            z-index: 1000;
            font-family: Arial, sans-serif;
        }
        #loading-screen p { margin-bottom: 20px; }
        .spinner {
            border: 8px solid rgba(255, 255, 255, 0.2);
            border-left-color: #ff0;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loading-screen">
        <p>Cargando Recursos del Juego...</p>
        <div class="spinner"></div>
        <p id="loading-progress">0%</p>
    </div>

    <div id="info">
        <div id="score">Puntuación: 0</div>
        <div id="controls-info">Controles: W/A/S/D o Flechas para mover. Ratón para mirar.</div>
        <div>Objetivo: ¡Recoge todos los choripanes!</div>
    </div>
    
    <div id="message"></div> 

    <div id="ghostFlashScreen">
        <img id="ghostFlashImage" src="" alt="Fantasma que te atrapó">
    </div>

    <div id="gameOverScreen">
        <h1 id="gameOverMainText">Game Over</h1>
        <p id="customGameOverMessage"></p> 
        <p id="gameOverScoreText">Puntuación: 0</p>
        <p id="gameOverRestartText">Haz clic para reiniciar.</p>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="joystick-area"> <div id="joystick-knob"></div> </div>
    <div id="action-buttons"> </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Configuración básica
        let scene, camera, renderer;
        let player, playerVelocity = new THREE.Vector3(), playerDirection = new THREE.Vector3();
        const playerSpeed = 10.0;
        const playerHeight = 1.0; 
        const playerRadius = 0.4; 
        const pelletCollectRadius = 0.6; 
        let controls = { W: false, S: false, A: false, D: false, ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };
        
        let maze = [];
        const mazeSize = 25; 
        const cellSize = 4; 
        const wallHeight = 3;
        let walls = []; 
        let pellets = [];
        let score = 0;
        let totalPellets = 0;
        
        let ghosts = [];
        const ghostSpeed = 8.0; 
        const ghostVisualScale = 2.0; 
        const ghostRadius = 0.75; 
        const MAX_GHOST_DISTANCE_TO_REPATH_SQUARED = (18 * cellSize) * (18 * cellSize); 

        let gameActive = false; 
        let gamePrepared = false; 

        const baseGhostImageUrls = [
            'https://i.ibb.co/LdQLN0X8/Carpous.jpg', 
            'https://i.ibb.co/9Hfcxrrt/Angel2.jpg',  
            'https://i.ibb.co/mVSF0JDJ/Dante.jpg'
        ];
        const ghostImageUrls = [];
        for (let i = 0; i < 4; i++) { 
            ghostImageUrls.push(...baseGhostImageUrls);
        }

        const pelletTextureUrl = 'https://i.ibb.co/XZVH4MV0/Choripan.jpg';
        let pelletTexture = null; 

        let texturesLoaded = 0;
        const gameOverImageUrl = 'https://i.ibb.co/nq8XpXMJ/Bruno-Game-Over.png';
        const totalTexturesToLoad = ghostImageUrls.length + 1 + 1; 
        const loadingManager = new THREE.LoadingManager();
        const textureLoader = new THREE.TextureLoader(loadingManager);
        
        const loadingProgressEl = document.getElementById('loading-progress');
        const loadingScreenEl = document.getElementById('loading-screen');

        let activeParticles = [];
        const particleGravity = 9.8;
        const particleCount = 20; 
        const particleLifespan = 0.8; 
        const particleSize = 0.08; 


        loadingManager.onProgress = function (url, itemsLoaded, itemsTotalManaged) {
            // console.log(`LoadingManager progress: ${itemsLoaded} / ${itemsTotalManaged} - ${url}`);
        };

        loadingManager.onLoad = function () { 
            console.log("LoadingManager: Todas las texturas gestionadas (fantasmas, pellet) cargadas.");
            if (texturesLoaded === totalTexturesToLoad) {
                prepareGameStart();
            }
        };
        loadingManager.onError = function (url) {
            console.error('Error general de LoadingManager al cargar: ' + url);
        };
        
        function updateLoadingProgress() {
            const progress = Math.round((texturesLoaded / totalTexturesToLoad) * 100);
            if(loadingProgressEl) loadingProgressEl.textContent = `${progress}%`;
            console.log(`Progreso de carga: ${progress}% (${texturesLoaded}/${totalTexturesToLoad})`);
        }
        
        function prepareGameStart() {
            if (gamePrepared) return; 

            if (texturesLoaded === totalTexturesToLoad) {
                gamePrepared = true;
                console.log("Todos los recursos (fantasmas, pellet, imagen Game Over) cargados.");
                
                drawMaze(); 
                placePlayerInMaze(); 

                if(loadingScreenEl && loadingScreenEl.style.display !== 'none') {
                    loadingScreenEl.style.display = 'none';
                    const messageEl = document.getElementById('message'); 
                    messageEl.textContent = "¡Listo! Haz clic para empezar.";
                    messageEl.style.display = 'block';
                    document.getElementById('gameCanvas').addEventListener('click', startGame, { once: true });
                }
            }
        }

        function preloadPelletTexture() {
            const specificPelletLoader = new THREE.TextureLoader(loadingManager);
            specificPelletLoader.load(
                pelletTextureUrl,
                function (texture) { 
                    pelletTexture = texture;
                    texturesLoaded++;
                    updateLoadingProgress();
                    console.log("Textura de pellet (Choripan) cargada.");
                    if (texturesLoaded === totalTexturesToLoad) {
                        prepareGameStart();
                    }
                },
                undefined, 
                function (err) { 
                    console.error("Error cargando textura de pellet (Choripan).", err);
                    texturesLoaded++; 
                    updateLoadingProgress();
                    if (texturesLoaded === totalTexturesToLoad) {
                        prepareGameStart();
                    }
                }
            );
        }


        function preloadGameOverImage() {
            const img = new Image();
            img.onload = () => {
                texturesLoaded++;
                updateLoadingProgress();
                console.log("Imagen de Game Over cargada en caché.");
                const gameOverScreenEl = document.getElementById('gameOverScreen');
                if(gameOverScreenEl) gameOverScreenEl.style.backgroundImage = `url('${gameOverImageUrl}')`;

                if (texturesLoaded === totalTexturesToLoad) { 
                    prepareGameStart();
                }
            };
            img.onerror = () => {
                texturesLoaded++;
                updateLoadingProgress();
                console.error("Error cargando imagen de Game Over para caché.");
                if (texturesLoaded === totalTexturesToLoad) {
                    prepareGameStart();
                }
            };
            img.src = gameOverImageUrl; 
        }


        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111111);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            player = new THREE.Group(); 
            player.add(camera); 
            scene.add(player);
            camera.position.set(0, playerHeight, 0); 


            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gameCanvas'), antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;

            const ambientLight = new THREE.AmbientLight(0x606060);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 10, 7.5);
            directionalLight.castShadow = true;
            scene.add(directionalLight);

            generateMaze();
            preloadPelletTexture(); 
            createGhosts(); 
            preloadGameOverImage(); 

            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            window.addEventListener('resize', onWindowResize);
            document.addEventListener('mousemove', onMouseMove);
            
            document.body.addEventListener('click', (event) => {
                const gameOverScreenEl = document.getElementById('gameOverScreen');
                const ghostFlashScreenEl = document.getElementById('ghostFlashScreen');
                if (gameActive && document.pointerLockElement !== document.body && 
                    (!gameOverScreenEl || gameOverScreenEl.style.display === 'none') &&
                    (!ghostFlashScreenEl || ghostFlashScreenEl.style.display === 'none') ) {
                    document.body.requestPointerLock();
                }
            });

            setupTouchControls();
        }
        

        function startGame() {
            const messageEl = document.getElementById('message');
            if (messageEl) messageEl.style.display = 'none';
            
            if (document.pointerLockElement !== document.body) {
                 document.body.requestPointerLock();
            }
            gameActive = true;
            if (!animationFrameId) { 
                animate();
            }
        }
        let animationFrameId = null; 


        function placePlayerInMaze() {
            for (let r = 1; r < mazeSize - 1; r++) { 
                for (let c = 1; c < mazeSize - 1; c++) {
                    if (maze[r][c] === 0) { 
                        player.position.set(c * cellSize + cellSize / 2, 0, r * cellSize + cellSize / 2);
                        if (c + 1 < mazeSize && maze[r][c+1] === 0) player.rotation.y = -Math.PI / 2; 
                        else if (r + 1 < mazeSize && maze[r+1][c] === 0) player.rotation.y = Math.PI; 
                        else if (c - 1 >=0 && maze[r][c-1] === 0) player.rotation.y = Math.PI / 2;
                        else if (r - 1 >=0 && maze[r-1][c] === 0) player.rotation.y = 0;
                        return;
                    }
                }
            }
             player.position.set(cellSize * 1.5, 0, cellSize * 1.5); 
        }

        generateMaze = function() { 
            maze = Array(mazeSize).fill(null).map(() => Array(mazeSize).fill(1)); 
            let stack = [];
            let startRow = 1 + 2 * Math.floor(Math.random() * Math.floor((mazeSize-1)/2)); 
            let startCol = 1 + 2 * Math.floor(Math.random() * Math.floor((mazeSize-1)/2));
            maze[startRow][startCol] = 0; 
            stack.push([startRow, startCol]);

            while (stack.length > 0) {
                let [r, c] = stack[stack.length - 1];
                let neighbors = [];
                const dirs = [ [-2,0,"N"], [2,0,"S"], [0,2,"E"], [0,-2,"W"] ];
                for (let i = dirs.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [dirs[i], dirs[j]] = [dirs[j], dirs[i]];
                }

                for(const [dr, dc] of dirs) {
                    const nr = r + dr; 
                    const nc = c + dc; 
                    const wr = r + dr/2; 
                    const wc = c + dc/2; 
                    
                    if (nr > 0 && nr < mazeSize -1 && nc > 0 && nc < mazeSize -1 && maze[nr][nc] === 1) {
                        neighbors.push({nr, nc, wr, wc});
                    }
                }

                if (neighbors.length > 0) {
                    let chosenNeighbor = neighbors[0]; 
                    maze[chosenNeighbor.nr][chosenNeighbor.nc] = 0; 
                    maze[chosenNeighbor.wr][chosenNeighbor.wc] = 0; 
                    stack.push([chosenNeighbor.nr, chosenNeighbor.nc]);
                } else {
                    stack.pop();
                }
            }

            const extraConnectionsPercentage = 0.10; 
            let wallsToRemove = Math.floor(mazeSize * mazeSize * extraConnectionsPercentage);
            let attempts = 0;
            for (let k = 0; k < wallsToRemove && attempts < wallsToRemove * 20; attempts++) { 
                const r = Math.floor(Math.random() * (mazeSize - 2)) + 1; 
                const c = Math.floor(Math.random() * (mazeSize - 2)) + 1;
                if (maze[r][c] === 1) { 
                    if ( (maze[r-1]?.[c] === 0 && maze[r+1]?.[c] === 0 && maze[r][c-1] === 1 && maze[r][c+1] === 1) || 
                         (maze[r][c-1] === 0 && maze[r][c+1] === 0 && maze[r-1]?.[c] === 1 && maze[r+1]?.[c] === 1) ){ 
                        maze[r][c] = 0;
                        k++;
                    }
                }
            }
        }

        function drawMaze() {
            walls.forEach(wallData => scene.remove(wallData.mesh)); 
            walls = []; 
            pellets.forEach(p => scene.remove(p)); 
            pellets = [];
            totalPellets = 0;

            const wallGeometry = new THREE.BoxGeometry(cellSize, wallHeight, cellSize);
            const wallMaterial = new THREE.MeshStandardMaterial({ color: 0xaaaa00 }); 

            const floorCeilingGeometry = new THREE.PlaneGeometry(mazeSize * cellSize, mazeSize * cellSize);
            const floorCeilingMaterial = new THREE.MeshStandardMaterial({ color: 0xffff00, side: THREE.DoubleSide }); 

            const floor = new THREE.Mesh(floorCeilingGeometry, floorCeilingMaterial);
            floor.rotation.x = -Math.PI / 2;
            floor.position.set((mazeSize * cellSize) / 2 - cellSize/2, 0, (mazeSize * cellSize) / 2 - cellSize/2);
            floor.receiveShadow = true;
            scene.add(floor);

            const ceiling = new THREE.Mesh(floorCeilingGeometry, floorCeilingMaterial);
            ceiling.rotation.x = Math.PI / 2;
            ceiling.position.set((mazeSize * cellSize) / 2 - cellSize/2, wallHeight, (mazeSize * cellSize) / 2 - cellSize/2);
            scene.add(ceiling);

            const pelletPlaneSize = 0.8; 
            const pelletGeometry = new THREE.PlaneGeometry(pelletPlaneSize, pelletPlaneSize);
            let currentPelletMaterial;
            if (pelletTexture) {
                currentPelletMaterial = new THREE.MeshBasicMaterial({ map: pelletTexture, transparent: true, side: THREE.DoubleSide, alphaTest: 0.5 });
            } else {
                currentPelletMaterial = new THREE.MeshBasicMaterial({ color: 0xffaa00, side: THREE.DoubleSide }); 
                console.warn("Textura de pellet no disponible al dibujar, usando color de fallback.");
            }


            for (let r = 0; r < mazeSize; r++) {
                for (let c = 0; c < mazeSize; c++) {
                    const x = c * cellSize + cellSize / 2;
                    const z = r * cellSize + cellSize / 2;
                    if (maze[r][c] === 1) { 
                        const wallMesh = new THREE.Mesh(wallGeometry, wallMaterial);
                        wallMesh.position.set(x, wallHeight / 2, z);
                        wallMesh.castShadow = true;
                        wallMesh.receiveShadow = true;
                        scene.add(wallMesh);
                        const wallBox = new THREE.Box3().setFromObject(wallMesh);
                        walls.push({mesh: wallMesh, box: wallBox}); 
                    } else { 
                        const pellet = new THREE.Mesh(pelletGeometry, currentPelletMaterial);
                        pellet.rotation.x = -Math.PI / 2; 
                        pellet.position.set(x, 0.1, z); 
                        scene.add(pellet);
                        pellets.push(pellet);
                        totalPellets++;
                    }
                }
            }
            console.log("Total de choripanes a recoger:", totalPellets);
            document.getElementById('score').textContent = `Choripanes: 0 / ${totalPellets}`;
        }
        

        function createGhosts() {
            const ghostGeometry = new THREE.PlaneGeometry(ghostVisualScale, ghostVisualScale); 

            ghostImageUrls.forEach((url, index) => { 
                textureLoader.load(url, 
                    (texture) => {  
                        texturesLoaded++;
                        updateLoadingProgress();
                        console.log(`Textura ${url} (fantasma ${index + 1}) cargada.`);
                        
                        const ghostMaterial = new THREE.MeshBasicMaterial({ map: texture, transparent: true, side: THREE.DoubleSide, alphaTest: 0.5, name: `ghost_mat_${index}` });
                        const ghost = new THREE.Mesh(ghostGeometry, ghostMaterial); 
                        setupGhost(ghost, index); 

                        if (texturesLoaded === totalTexturesToLoad) {
                           prepareGameStart();
                        }
                    },
                    undefined, 
                    (err) => { 
                        console.error(`Error cargando textura ${url} (fantasma ${index + 1}):`, err);
                        texturesLoaded++; 
                        updateLoadingProgress();
                        const errorMaterial = new THREE.MeshBasicMaterial({ color: 0xff0000, side: THREE.DoubleSide, name: `error_ghost_${index}` });
                        const ghost = new THREE.Mesh(ghostGeometry, errorMaterial); 
                        setupGhost(ghost, index);

                        if (texturesLoaded === totalTexturesToLoad) {
                           prepareGameStart();
                        }
                    }
                );
            });
        }
        
        function setupGhost(ghost, index) {
            placeGhostInMaze(ghost, index);
            ghost.userData = {
                id: index, 
                originalTypeIndex: index % baseGhostImageUrls.length, 
                currentPath: [],
                pathIndex: 0,
                lastPlayerCellR: -1,
                lastPlayerCellC: -1,
                repathCooldown: 0.1 + Math.random() * 0.2, 
                debugPathLine: null 
            };
            ghosts.push(ghost);
            scene.add(ghost); 
        }


        function placeGhostInMaze(ghost, index) {
            let placed = false;
            let attempts = 0;
            const minInitialDistToPlayer = 5 + Math.floor(index / 2); 
            const maxAttempts = 300; 

            while (!placed && attempts < maxAttempts) {
                attempts++;
                const r = Math.floor(Math.random() * (mazeSize - 2)) + 1; 
                const c = Math.floor(Math.random() * (mazeSize - 2)) + 1;
                if (maze[r][c] === 0) { 
                    const playerCellR = player ? Math.floor(player.position.z / cellSize) : Math.floor(mazeSize/2); 
                    const playerCellC = player ? Math.floor(player.position.x / cellSize) : Math.floor(mazeSize/2);
                    if (Math.abs(r - playerCellR) + Math.abs(c - playerCellC) > minInitialDistToPlayer) { 
                        let tooCloseToAnotherGhost = false;
                        for(const otherGhost of ghosts){
                            if(otherGhost.position.distanceTo(new THREE.Vector3(c * cellSize + cellSize / 2, playerHeight / 2, r * cellSize + cellSize / 2)) < cellSize * 1.5){ 
                                tooCloseToAnotherGhost = true;
                                break;
                            }
                        }
                        if(!tooCloseToAnotherGhost){
                            ghost.position.set(c * cellSize + cellSize / 2, playerHeight / 2, r * cellSize + cellSize / 2);
                            placed = true;
                        }
                    }
                }
            }
            if (!placed) { 
                 const angle = (index / totalTexturesToLoad) * Math.PI * 2; 
                 const radiusFactor = mazeSize / 3 + (index % 3); 
                 let fallbackR = Math.floor(mazeSize / 2 + Math.sin(angle) * radiusFactor);
                 let fallbackC = Math.floor(mazeSize / 2 + Math.cos(angle) * radiusFactor);
                 fallbackR = Math.max(1, Math.min(mazeSize - 2, fallbackR));
                 fallbackC = Math.max(1, Math.min(mazeSize - 2, fallbackC));

                 if(maze[fallbackR]?.[fallbackC] === 0){
                    ghost.position.set(fallbackC * cellSize + cellSize / 2, playerHeight / 2, fallbackR * cellSize + cellSize / 2);
                 } else { 
                    for (let r_fb = 1; r_fb < mazeSize - 1; r_fb++) {
                        for (let c_fb = 1; c_fb < mazeSize - 1; c_fb++) {
                            if (maze[r_fb][c_fb] === 0) {
                                let tooClose = ghosts.some(g => g.position.distanceTo(new THREE.Vector3(c_fb * cellSize + cellSize/2, playerHeight/2, r_fb * cellSize + cellSize/2)) < cellSize);
                                if (!tooClose) {
                                    ghost.position.set(c_fb * cellSize + cellSize / 2, playerHeight / 2, r_fb * cellSize + cellSize / 2);
                                    return;
                                }
                            }
                        }
                    }
                     ghost.position.set(cellSize * 1.5, playerHeight / 2, cellSize * 1.5);
                 }
            }
        }

        function onKeyDown(event) {
            if (!gameActive && event.key !== 'Escape') return; 
            switch (event.code) {
                case 'KeyW': controls.W = true; break;
                case 'KeyS': controls.S = true; break;
                case 'KeyA': controls.A = true; break;
                case 'KeyD': controls.D = true; break;
                case 'ArrowUp': controls.ArrowUp = true; break;
                case 'ArrowDown': controls.ArrowDown = true; break;
                case 'ArrowLeft': controls.ArrowLeft = true; break;
                case 'ArrowRight': controls.ArrowRight = true; break;
            }
             if (event.key === 'Escape') {
                if (document.pointerLockElement === document.body) {
                    document.exitPointerLock();
                }
            }
        }

        function onKeyUp(event) {
            if (!gameActive) return;
            switch (event.code) {
                case 'KeyW': controls.W = false; break;
                case 'KeyS': controls.S = false; break;
                case 'KeyA': controls.A = false; break;
                case 'KeyD': controls.D = false; break;
                case 'ArrowUp': controls.ArrowUp = false; break;
                case 'ArrowDown': controls.ArrowDown = false; break;
                case 'ArrowLeft': controls.ArrowLeft = false; break;
                case 'ArrowRight': controls.ArrowRight = false; break;
            }
        }
        
        const pitchSpeed = 0.002;
        const yawSpeed = 0.002;

        function onMouseMove(event) {
            if (document.pointerLockElement === document.body && gameActive) {
                player.rotation.y -= event.movementX * yawSpeed;
                camera.rotation.x -= event.movementY * pitchSpeed;
                camera.rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, camera.rotation.x));
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function checkCollisions(newPosition) {
            const playerCollider = new THREE.Box3(
                new THREE.Vector3(newPosition.x - playerRadius, 0, newPosition.z - playerRadius), 
                new THREE.Vector3(newPosition.x + playerRadius, playerHeight, newPosition.z + playerRadius) 
            );

            for (let wallData of walls) { 
                if (playerCollider.intersectsBox(wallData.box)) {
                    return true; 
                }
            }
            return false; 
        }

        function updatePlayer(delta) {
            if (!gameActive) return;

            playerVelocity.set(0, 0, 0);
            let moveForward = controls.W || controls.ArrowUp;
            let moveBackward = controls.S || controls.ArrowDown;
            let moveLeft = controls.A || controls.ArrowLeft;
            let moveRight = controls.D || controls.ArrowRight;

            if (joystickActive) {
                const angle = joystickAngle;
                const distance = joystickDistance; 
                 if (distance > 0.1) {
                    const moveX = Math.cos(angle) * distance; 
                    const moveZ = Math.sin(angle) * distance; 

                    if (moveZ < -0.3) moveForward = true;  
                    if (moveZ > 0.3) moveBackward = true; 
                    if (moveX < -0.3) moveLeft = true;    
                    if (moveX > 0.3) moveRight = true;   
                 }
            }

            camera.getWorldDirection(playerDirection); 
            playerDirection.y = 0; 
            playerDirection.normalize();

            if (moveForward) playerVelocity.add(playerDirection.clone().multiplyScalar(playerSpeed * delta));
            if (moveBackward) playerVelocity.add(playerDirection.clone().multiplyScalar(-playerSpeed * delta));
            
            const strafeDirection = new THREE.Vector3();
            strafeDirection.crossVectors(player.up, playerDirection).normalize(); 

            if (moveLeft) playerVelocity.add(strafeDirection.clone().multiplyScalar(playerSpeed * delta));
            if (moveRight) playerVelocity.add(strafeDirection.clone().multiplyScalar(-playerSpeed * delta));


            const oldPosition = player.position.clone();
            const newPositionCandidate = player.position.clone().add(playerVelocity);
            
            let newXPos = player.position.clone(); newXPos.x += playerVelocity.x;
            let newZPos = player.position.clone(); newZPos.z += playerVelocity.z;

            if (!checkCollisions(new THREE.Vector3(newPositionCandidate.x, player.position.y, player.position.z))) {
                player.position.x = newPositionCandidate.x;
            }
            if (!checkCollisions(new THREE.Vector3(player.position.x, player.position.y, newPositionCandidate.z))) {
                player.position.z = newPositionCandidate.z;
            }


            for (let i = pellets.length - 1; i >= 0; i--) {
                const pellet = pellets[i];
                if (player.position.distanceTo(pellet.position) < playerRadius + pelletCollectRadius) { 
                    let cameraWorldPos = new THREE.Vector3();
                    camera.getWorldPosition(cameraWorldPos); 
                    createChoripanParticles(cameraWorldPos); 
                    
                    scene.remove(pellet);
                    pellet.geometry.dispose(); 
                    if(pellet.material.map) pellet.material.map.dispose(); 
                    pellet.material.dispose(); 
                    pellets.splice(i, 1);
                    score++;
                    document.getElementById('score').textContent = `Choripanes: ${score} / ${totalPellets}`;
                    if (pellets.length === 0 && totalPellets > 0) { 
                        gameOver(true); 
                    }
                }
            }
        }
        
        function findPathBFS(startCell, endCell, mazeLayout) {
            const queue = [[startCell]]; 
            const visited = new Set([`${startCell.r},${startCell.c}`]);
            const paths = new Map(); 
            paths.set(`${startCell.r},${startCell.c}`, null);

            const moves = [ {r: -1, c: 0}, {r: 1, c: 0}, {r: 0, c: -1}, {r: 0, c: 1} ]; 

            while (queue.length > 0) {
                const currentPathSegmentStart = queue.shift(); 
                const currentR = currentPathSegmentStart.r;
                const currentC = currentPathSegmentStart.c;

                if (currentR === endCell.r && currentC === endCell.c) {
                    let path = [];
                    let curr = endCell;
                    while(curr) {
                        path.unshift(curr); 
                        const prevKey = paths.get(`${curr.r},${curr.c}`);
                        if (!prevKey) break;
                        const [pr, pc] = prevKey.split(',').map(Number);
                        curr = (pr === startCell.r && pc === startCell.c) ? null : {r: pr, c: pc}; 
                         if (path.length > mazeSize * mazeSize) return null; 
                    }
                    return path.length > 1 ? path : null; 
                }

                for (const move of moves) {
                    const nextR = currentR + move.r;
                    const nextC = currentC + move.c;
                    const cellKey = `${nextR},${nextC}`;

                    if (nextR >= 0 && nextR < mazeSize && nextC >= 0 && nextC < mazeSize &&
                        mazeLayout[nextR][nextC] === 0 && !visited.has(cellKey)) {
                        
                        visited.add(cellKey);
                        paths.set(cellKey, `${currentR},${currentC}`);
                        queue.push({r: nextR, c: nextC});
                    }
                }
            }
            return null; 
        }


        function updateGhosts(delta) {
            if (!gameActive) return;

            const playerCellR = Math.floor(player.position.z / cellSize);
            const playerCellC = Math.floor(player.position.x / cellSize);

            ghosts.forEach(ghost => {
                ghost.lookAt(player.position.x, playerHeight / 2, player.position.z);
                ghost.userData.repathCooldown = Math.max(0, ghost.userData.repathCooldown - delta);

                const ghostCellR = Math.floor(ghost.position.z / cellSize);
                const ghostCellC = Math.floor(ghost.position.x / cellSize);
                const distToPlayerSq = ghost.position.distanceToSquared(player.position);

                let needsNewPath = false;
                if (!ghost.userData.currentPath || ghost.userData.pathIndex >= ghost.userData.currentPath.length) {
                    needsNewPath = true; 
                } else if (playerCellR !== ghost.userData.lastPlayerCellR || playerCellC !== ghost.userData.lastPlayerCellC) {
                    const isGhostVeryCloseToPlayer = distToPlayerSq < (cellSize * 1.5) * (cellSize * 1.5);
                    if (!isGhostVeryCloseToPlayer) {
                         needsNewPath = true;
                    } else { 
                        const nextCellInPath = ghost.userData.currentPath[ghost.userData.pathIndex];
                        if (nextCellInPath && (nextCellInPath.r !== playerCellR || nextCellInPath.c !== playerCellC)) {
                            needsNewPath = true;
                        }
                    }
                }
                if (distToPlayerSq > MAX_GHOST_DISTANCE_TO_REPATH_SQUARED && ghost.userData.repathCooldown <= 0) {
                    needsNewPath = true; 
                }
                if (ghost.userData.repathCooldown > 0 && needsNewPath) { 
                    needsNewPath = false;
                }


                if (needsNewPath) {
                    const path = findPathBFS({ r: ghostCellR, c: ghostCellC }, { r: playerCellR, c: playerCellC }, maze);
                    if (path && path.length > 1) { 
                        ghost.userData.currentPath = path;
                        ghost.userData.pathIndex = 1; 
                        ghost.userData.repathCooldown = 0.1 + Math.random() * 0.2; 
                    } else { 
                        const possibleMoves = [];
                        const dirs = [{r:-1,c:0},{r:1,c:0},{r:0,c:-1},{r:0,c:1}];
                        for(const d of dirs){
                            const nr = ghostCellR + d.r;
                            const nc = ghostCellC + d.c;
                            if(nr >=0 && nr < mazeSize && nc >= 0 && nc < mazeSize && maze[nr][nc] === 0){
                                possibleMoves.push({r:nr, c:nc});
                            }
                        }
                        if(possibleMoves.length > 0){
                            const randomTarget = possibleMoves[Math.floor(Math.random() * possibleMoves.length)];
                            ghost.userData.currentPath = [{r: ghostCellR, c: ghostCellC}, randomTarget];
                            ghost.userData.pathIndex = 1;
                        } else {
                             ghost.userData.currentPath = []; 
                             ghost.userData.pathIndex = 0;
                        }
                    }
                    ghost.userData.lastPlayerCellR = playerCellR;
                    ghost.userData.lastPlayerCellC = playerCellC;
                }

                if (ghost.userData.currentPath && ghost.userData.pathIndex < ghost.userData.currentPath.length) {
                    const nextCellInPath = ghost.userData.currentPath[ghost.userData.pathIndex];
                    let targetPosition = new THREE.Vector3(
                        nextCellInPath.c * cellSize + cellSize / 2,
                        playerHeight / 2, 
                        nextCellInPath.r * cellSize + cellSize / 2
                    );

                    const isGhostInOrNextToPlayerCell = (Math.abs(ghostCellR - playerCellR) <= 1 && Math.abs(ghostCellC - playerCellC) <= 1);
                    if (isGhostInOrNextToPlayerCell && nextCellInPath.r === playerCellR && nextCellInPath.c === playerCellC) {
                        targetPosition.copy(player.position);
                        targetPosition.y = playerHeight / 2; 
                    }

                    const directionToTarget = targetPosition.clone().sub(ghost.position).normalize();
                    ghost.position.add(directionToTarget.multiplyScalar(ghostSpeed * delta));

                    if (ghost.position.distanceTo(targetPosition) < 0.5) { 
                        ghost.userData.pathIndex++;
                    }
                }

                if (distToPlayerSq < (playerRadius + ghostRadius) * (playerRadius + ghostRadius) ) {
                    gameOver(false, ghost); 
                }
            });
        }
        
        function createChoripanParticles(cameraWorldPosition) {
            const particleGeometry = new THREE.SphereGeometry(particleSize, 6, 6); 
            const forwardVector = new THREE.Vector3();
            camera.getWorldDirection(forwardVector); 
            
            for (let i = 0; i < particleCount; i++) {
                const particleColor = Math.random() < 0.6 ? 0x8B4513 : 0xCC0000; 
                const particleMaterial = new THREE.MeshBasicMaterial({ color: particleColor });
                const particle = new THREE.Mesh(particleGeometry, particleMaterial);
                
                const spawnPos = cameraWorldPosition.clone();
                // Ajustar la altura para que aparezcan más cerca de la altura de la cámara, pero ligeramente adelante
                spawnPos.y -= 0.1; // Ligeramente por debajo del centro de la cámara
                spawnPos.addScaledVector(forwardVector, 0.6); // Más adelante de la cámara

                particle.position.copy(spawnPos);
                // Añadir una pequeña dispersión aleatoria a la posición inicial
                particle.position.x += (Math.random() - 0.5) * 0.3;
                particle.position.y += (Math.random() - 0.5) * 0.2;
                particle.position.z += (Math.random() - 0.5) * 0.3;

                const velocitySpread = 1.8; 
                const upwardStrength = 1.0; // Reducir un poco el impulso hacia arriba para que no suban tanto
                
                particle.userData.velocity = new THREE.Vector3(
                    (Math.random() - 0.5) * velocitySpread,      
                    (Math.random() * 0.4 + 0.2) * upwardStrength, // Menor impulso inicial hacia arriba
                    (Math.random() - 0.5) * velocitySpread       
                );
                particle.userData.velocity.applyQuaternion(player.quaternion); 
                particle.userData.velocity.normalize().multiplyScalar(Math.random() * 1.0 + 0.7);

                particle.userData.lifespan = particleLifespan + (Math.random() - 0.5) * 0.3; 

                scene.add(particle);
                activeParticles.push(particle);
            }
        }

        function updateParticles(delta) {
            for (let i = activeParticles.length - 1; i >= 0; i--) {
                const particle = activeParticles[i];
                particle.userData.lifespan -= delta;

                if (particle.userData.lifespan <= 0) {
                    scene.remove(particle);
                    particle.material.dispose();
                    activeParticles.splice(i, 1);
                } else {
                    particle.userData.velocity.y -= particleGravity * delta; 
                    particle.position.addScaledVector(particle.userData.velocity, delta);
                }
            }
        }


        function gameOver(isWin, caughtByGhost = null) {
            if (!gameActive && !isWin && pellets.length === 0 && totalPellets > 0) return; 
            if (!gameActive && isWin) return; 

            gameActive = false;
            if (document.pointerLockElement === document.body) {
                document.exitPointerLock();
            }
            cancelAnimationFrame(animationFrameId); 
            animationFrameId = null;

            const infoEl = document.getElementById('info');
            if (infoEl) infoEl.style.display = 'none';
            const joystickEl = document.getElementById('joystick-area');
            if (joystickEl) joystickEl.style.display = 'none';
            const messageEl = document.getElementById('message'); 
            if(messageEl) messageEl.style.display = 'none';

            const gameOverScreenEl = document.getElementById('gameOverScreen');
            const ghostFlashScreenEl = document.getElementById('ghostFlashScreen');
            const ghostFlashImageEl = document.getElementById('ghostFlashImage');
            const gameOverMainTextEl = document.getElementById('gameOverMainText');
            const customMessageEl = document.getElementById('customGameOverMessage');
            const scoreTextEl = document.getElementById('gameOverScoreText');
            
            const showFinalGameOverScreen = (losingGhost) => {
                gameOverMainTextEl.textContent = "Game Over";
                let finalCustomMessage = "";
                 if (losingGhost) {
                    const originalType = losingGhost.userData.originalTypeIndex; 
                    switch (originalType) {
                        case 0: 
                            finalCustomMessage = "You are gei";
                            break;
                        case 1: 
                            finalCustomMessage = "You have been Peruaned";
                            break;
                        case 2: 
                            finalCustomMessage = "Perra";
                            break;
                        default:
                            finalCustomMessage = "¡Te atraparon!";
                    }
                } else {
                    finalCustomMessage = "¡Te atraparon!"; 
                }
                customMessageEl.textContent = finalCustomMessage;
                scoreTextEl.textContent = `Puntuación: ${score}`;
                gameOverScreenEl.style.display = 'flex'; 
            
                const restartHandler = () => {
                    window.location.reload();
                };
                gameOverScreenEl.removeEventListener('click', restartHandler); 
                gameOverScreenEl.addEventListener('click', restartHandler, { once: true });
            };


            if (isWin) {
                gameOverMainTextEl.textContent = "¡VICTORIA!"; 
                customMessageEl.textContent = "¡Has devorado todos los choripanes!";
                scoreTextEl.textContent = `Puntuación final: ${score}`;
                gameOverScreenEl.style.display = 'flex'; 
                const restartHandler = () => { window.location.reload(); };
                gameOverScreenEl.removeEventListener('click', restartHandler); 
                gameOverScreenEl.addEventListener('click', restartHandler, { once: true });
            } else { 
                if (caughtByGhost) {
                    // El índice del fantasma en el array ghostImageUrls es caughtByGhost.userData.id
                    ghostFlashImageEl.src = ghostImageUrls[caughtByGhost.userData.id]; 
                    ghostFlashScreenEl.classList.add('shake-active');
                    ghostFlashScreenEl.style.display = 'flex';
                    setTimeout(() => {
                        ghostFlashScreenEl.classList.remove('shake-active');
                        ghostFlashScreenEl.style.display = 'none';
                        showFinalGameOverScreen(caughtByGhost);
                    }, 1500);
                } else {
                    showFinalGameOverScreen(null);
                }
            }
        }

        const clock = new THREE.Clock();
        function animate() {
            if (!gameActive && pellets.length > 0 && totalPellets > 0 && gamePrepared) { 
                animationFrameId = requestAnimationFrame(animate);
                renderer.render(scene, camera); 
                return;
            }
            if (!gameActive || !gamePrepared) { 
                if (!gamePrepared && loadingScreenEl.style.display !== 'none') { 
                     animationFrameId = requestAnimationFrame(animate);
                }
                return;
            }

            animationFrameId = requestAnimationFrame(animate);
            const delta = clock.getDelta();
            
            updatePlayer(delta);
            updateGhosts(delta);
            updateParticles(delta); 

            if (player) {
                pellets.forEach(pellet => {
                    const angleToPlayer = Math.atan2(
                        player.position.x - pellet.position.x,
                        player.position.z - pellet.position.z
                    );
                    pellet.rotation.y = angleToPlayer; 
                });
            }
            
            renderer.render(scene, camera);
        }

        // --- Controles Táctiles ---
        const joystickArea = document.getElementById('joystick-area');
        const joystickKnob = document.getElementById('joystick-knob');
        let joystickActive = false;
        let joystickStartX = 0, joystickStartY = 0;
        let joystickAngle = 0, joystickDistance = 0; 
        let lookTouchIdentifier = null;
        let lookStartX = 0, lookStartY = 0;


        function setupTouchControls() {
            if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
                joystickArea.style.display = 'flex';
                document.getElementById('controls-info').textContent = "Controles: Joystick para mover. Desliza en pantalla para mirar.";

                joystickArea.addEventListener('touchstart', handleJoystickStart, { passive: false });
                joystickArea.addEventListener('touchmove', handleJoystickMove, { passive: false });
                joystickArea.addEventListener('touchend', handleJoystickEnd, { passive: false });
                joystickArea.addEventListener('touchcancel', handleJoystickEnd, { passive: false });
                
                document.body.addEventListener('touchstart', handleLookStart, { passive: false });
                document.body.addEventListener('touchmove', handleLookMove, { passive: false });
                document.body.addEventListener('touchend', handleLookEnd, { passive: false });
                document.body.addEventListener('touchcancel', handleLookEnd, { passive: false });
            }
        }

        function handleLookStart(event) {
            if (!gameActive || lookTouchIdentifier !== null) return;
            const target = event.target;
            const gameOverScreenEl = document.getElementById('gameOverScreen'); 
            const ghostFlashScreenEl = document.getElementById('ghostFlashScreen');
            if (target === joystickArea || joystickArea.contains(target) || 
                (gameOverScreenEl && gameOverScreenEl.style.display === 'flex' && (target === gameOverScreenEl || gameOverScreenEl.contains(target))) ||
                (ghostFlashScreenEl && ghostFlashScreenEl.style.display === 'flex' && (target === ghostFlashScreenEl || ghostFlashScreenEl.contains(target)))
             ) { 
                return; 
            }
            for (let i = 0; i < event.changedTouches.length; i++) {
                const touch = event.changedTouches[i];
                if (touch.target !== joystickArea && !joystickArea.contains(touch.target)) {
                    lookTouchIdentifier = touch.identifier;
                    lookStartX = touch.clientX;
                    lookStartY = touch.clientY;
                    event.preventDefault(); 
                    break;
                }
            }
        }

        function handleLookMove(event) {
            if (!gameActive || lookTouchIdentifier === null) return;
             for (let i = 0; i < event.changedTouches.length; i++) {
                const touch = event.changedTouches[i];
                if (touch.identifier === lookTouchIdentifier) {
                    event.preventDefault(); 
                    const deltaX = touch.clientX - lookStartX;
                    const deltaY = touch.clientY - lookStartY;

                    player.rotation.y -= deltaX * yawSpeed * 0.3; 
                    camera.rotation.x -= deltaY * pitchSpeed * 0.3;
                    camera.rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, camera.rotation.x));

                    lookStartX = touch.clientX;
                    lookStartY = touch.clientY;
                    break;
                }
            }
        }
        function handleLookEnd(event) {
            if (lookTouchIdentifier === null) return;
            for (let i = 0; i < event.changedTouches.length; i++) {
                const touch = event.changedTouches[i];
                if (touch.identifier === lookTouchIdentifier) {
                    lookTouchIdentifier = null;
                    break;
                }
            }
        }


        function handleJoystickStart(event) {
            if (!gameActive) return;
            event.preventDefault();
            joystickActive = true;
            const touch = event.touches[0]; 
            const rect = joystickArea.getBoundingClientRect();
            joystickStartX = rect.left + rect.width / 2;
            joystickStartY = rect.top + rect.height / 2;
            updateJoystickKnob(touch.clientX, touch.clientY);
        }

        function handleJoystickMove(event) {
            if (!gameActive || !joystickActive) return;
            event.preventDefault();
            const touch = event.touches[0];
            updateJoystickKnob(touch.clientX, touch.clientY);
        }
        
        function updateJoystickKnob(touchX, touchY) {
            let dx = touchX - joystickStartX;
            let dy = touchY - joystickStartY;
            joystickAngle = Math.atan2(dy, dx);
            
            const maxDistanceAllowed = joystickArea.offsetWidth / 2; 
            let currentDist = Math.sqrt(dx * dx + dy * dy);
            joystickDistance = Math.min(currentDist / maxDistanceAllowed, 1.0); 

            const knobMaxTravel = maxDistanceAllowed - joystickKnob.offsetWidth / 2;
            const knobX = Math.cos(joystickAngle) * Math.min(currentDist, knobMaxTravel);
            const knobY = Math.sin(joystickAngle) * Math.min(currentDist, knobMaxTravel);
            joystickKnob.style.transform = `translate(${knobX}px, ${knobY}px)`;
        }


        function handleJoystickEnd(event) {
            if (!joystickActive) return;
            joystickActive = false;
            joystickKnob.style.transform = `translate(0px, 0px)`; 
            joystickAngle = 0;
            joystickDistance = 0;
            controls.W = controls.ArrowUp = false;
            controls.S = controls.ArrowDown = false;
            controls.A = controls.ArrowLeft = false;
            controls.D = controls.ArrowRight = false;
        }

        window.onload = () => {
            init();
        };

    </script>
